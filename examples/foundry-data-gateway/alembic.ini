# Alembic, for the COMMAND LINE. The in-process path (`AlembicMigrations`, wired
# by `composition/container.py::build_migrations`) builds its own Config in
# memory and never reads this file.
#
# `sqlalchemy.url` IS DELIBERATELY EMPTY. `migrations/env.py` resolves the
# database through `ServiceConfig.from_environment()`, which is the same
# authority the running service uses, so `alembic upgrade head` and the service
# it is migrating for can never disagree about which database they mean. A URL
# written here would be a second answer -- and the one a reader trusts, because
# it is the one they can see.
#
#     DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/service_test \
#       alembic upgrade head
#
# A service emitted from this template keeps this file as it stands. The only
# line worth editing is `script_location`, and only if the tree moves.

[alembic]
script_location = migrations
sqlalchemy.url =
# Timestamped, zero-padded, and ordered. A revision filename that sorts the way
# the revisions apply is the difference between reading a version directory and
# reconstructing it from `down_revision` pointers.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src:service-kit/vendor

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
